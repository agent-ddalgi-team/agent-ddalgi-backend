[project]
name = "agent-ddalgi-backend"
version = "0.1.0"
description = "거산케미칼 회사소개서 초안 도우미 - 백엔드/Agent"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "jinja2>=3.1",
    "pillow>=12.3.0",
    "pypdf>=6.19.0",
    "pypdfium2>=5.13",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
